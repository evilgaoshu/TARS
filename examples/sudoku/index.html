<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="EVI-142 简单数独示例：TARS examples/sudoku" />
    <title>数独 · EVI-142</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="tag">EVI-142</span>
          <h1>数独</h1>
          <p class="subtitle">TARS examples/sudoku · 9×9 · 唯一解题面</p>
        </div>
        <div class="hud">
          <div class="hud-item">
            <span class="hud-label">题目</span>
            <span class="hud-value" id="fixture-label">载入中…</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">用时</span>
            <span class="hud-value mono" id="timer">00:00</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">状态</span>
            <span class="hud-value" id="status" data-state="idle">未开始</span>
          </div>
        </div>
      </header>

      <main class="stage">
        <section class="board-panel">
          <div id="board" class="board" role="grid" aria-label="9乘9数独棋盘"></div>
          <div id="banner" class="banner" role="status" hidden>
            <strong id="banner-title">完成</strong>
            <span id="banner-detail"></span>
          </div>
        </section>

        <aside class="side">
          <div class="panel">
            <h2 class="panel-title">数字键盘</h2>
            <div class="numpad" id="numpad"></div>
            <button type="button" class="btn btn-ghost" id="btn-clear">清除 (⌫)</button>
          </div>

          <div class="panel">
            <h2 class="panel-title">题目</h2>
            <label class="field" for="fixture-select">切换题面</label>
            <select id="fixture-select" class="select"></select>
            <div class="actions">
              <button type="button" class="btn" id="btn-new">新游戏</button>
              <button type="button" class="btn btn-quiet" id="btn-reset">重置</button>
            </div>
          </div>

          <div class="panel legend">
            <h2 class="panel-title">图例</h2>
            <ul>
              <li><span class="swatch given"></span>题目格（只读）</li>
              <li><span class="swatch user"></span>你填的数字</li>
              <li><span class="swatch conflict"></span>行 / 列 / 宫重复提示</li>
              <li><span class="swatch peer"></span>当前格的同行同列同宫</li>
            </ul>
            <p class="hint">
              键盘：方向键移动，1–9 填写，Backspace / Delete 清除。手机可点数字键盘操作。
            </p>
          </div>
        </aside>
      </main>

      <footer class="footer">
        <span>规则与状态见 <code>rules.mjs</code> / <code>game.mjs</code>，题面见 <code>fixtures.json</code></span>
        <span>验收命令见 README.md，规格见 SPEC.md</span>
      </footer>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
